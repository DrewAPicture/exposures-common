name: Publish

# Phase 5 of exp-shared-library-feasibility-plan.md. Triggered by pushing a version tag (e.g.
# `git tag v0.1.0 && git push origin v0.1.0`) — the tag name isn't otherwise read by this
# workflow, it's just the release trigger; the actual published version comes from
# build.gradle.kts's `allprojects { version = ... }`. Bump that alongside the tag.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Publish to GitHub Packages
        run: ./gradlew publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Uses the gh CLI preinstalled on GitHub-hosted runners rather than a third-party action —
      # one less thing to pin/maintain for a single `gh release create` call.
      - name: Create GitHub release
        run: gh release create "${{ github.ref_name }}" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
