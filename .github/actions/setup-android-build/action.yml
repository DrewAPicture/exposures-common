name: Setup Android build
description: >
  Checkout, JDK 17, and Gradle setup shared by exposures-phone/exposures-watch CI workflows.
  Consumers add their own repo-specific steps (permissions, env vars, extra checks) after this —
  this only covers the identical bootstrapping part. Not used by this repo's own workflows: a
  composite action whose first step is `actions/checkout` can't be referenced by local path
  (`uses: ./...`) from its own defining repo, since GitHub Actions needs the repo already checked
  out to even find the action.yml — that only works for cross-repo consumers, which GitHub
  fetches independently. exposures-common's own ci.yml/publish.yml keep the three steps inline.

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up JDK 17
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: temurin
        java-version: "17"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
